    <iframe name="content" id="content" src="01-foundations.html" title="Section content"></iframe>
  </div>

<script>
(function () {
  const links = Array.from(document.querySelectorAll('#tabnav a'));
  const frame = document.getElementById('content');
  const pages = links.map(a => a.dataset.page);
  const DEFAULT_PAGE = '01-foundations.html';

  const slugOf = page => page.replace(/\.html$/, '');
  const pageOf = slug => pages.find(p => slugOf(p) === slug);

  function setActive(page) {
    links.forEach(l => {
      const on = l.dataset.page === page;
      l.classList.toggle('active', on);
      if (on) l.setAttribute('aria-current', 'page');
      else l.removeAttribute('aria-current');
    });
  }

  // Apply whatever the hash says — this is what makes deep links,
  // browser back/forward, and reload-in-place all work.
  function applyHash() {
    const page = pageOf(location.hash.replace(/^#/, '')) || DEFAULT_PAGE;
    if (frame.getAttribute('src') !== page) frame.setAttribute('src', page);
    setActive(page);
  }

  // Tab clicks write the hash; hashchange performs the navigation.
  // With JS off, the plain href + target="content" still works.
  // Tabs are text-selectable; ignore the click that ends a drag-select so
  // highlighting a tab label doesn't also navigate.
  function selectingWithin(el) {
    const sel = window.getSelection();
    return !!(sel && !sel.isCollapsed && sel.toString().trim() &&
              sel.anchorNode && el.contains(sel.anchorNode));
  }

  links.forEach(a => {
    a.addEventListener('click', e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
      if (selectingWithin(a)) { e.preventDefault(); return; }
      e.preventDefault();
      const slug = slugOf(a.dataset.page);
      if (location.hash.replace(/^#/, '') === slug) applyHash();
      else location.hash = slug;
    });
  });

  window.addEventListener('hashchange', applyHash);

  // Keep the hash in step if a link inside a section navigates the frame.
  frame.addEventListener('load', () => {
    let page = null;
    try {
      page = frame.contentWindow.location.pathname.split('/').pop();
    } catch (err) {
      return; // opaque file:// origin in some browsers; tab clicks still fine
    }
    if (!page || !pages.includes(page)) return;
    setActive(page);
    const slug = slugOf(page);
    if (location.hash.replace(/^#/, '') !== slug) {
      history.replaceState(null, '', '#' + slug);
    }
  });

  if (location.hash) applyHash();
})();
</script>

</body>
</html>
